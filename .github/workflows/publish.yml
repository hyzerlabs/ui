name: Publish

# Publishes to npm via trusted publishing (OIDC) when a version tag is
# pushed. No tokens, no OTP: npm trusts this repo+workflow directly, and
# generates provenance for the release. Requires the trusted publisher to
# be configured on npmjs.com for @hyzer-labs/ui (repo hyzerlabs/ui,
# workflow publish.yml).
on:
  push:
    tags: ['v*']

permissions:
  contents: write # needed by gh release create
  id-token: write # the OIDC token npm exchanges for publish access

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      # Trusted publishing needs npm >= 11.5.1; Node's bundled npm is older.
      # Pinned to 11, not latest: npm 12 raised its node floor past .nvmrc's
      # 22.18 and broke the v0.3.0 run with EBADENGINE.
      - name: Update npm for OIDC support
        run: npm install -g npm@11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # prepublishOnly runs the package build + publint as the final gate.
      - name: Publish
        run: npm publish

      # Mirror the changelog section as the GitHub Release, so the tag, npm,
      # and the releases page all say the same thing.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          pnpm exec tsx scripts/release-notes.ts "$VERSION" > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" --verify-tag --latest \
            --title "$VERSION" --notes-file "$RUNNER_TEMP/notes.md"
